<header class="page-header">
  <div>
    <h1 class="page-header__title">Nuevo Usuario</h1>
    <p class="page-header__desc">Registre un nuevo miembro del equipo y asígnele un rol.</p>
  </div>
  <a routerLink="/users" class="btn btn--outline" style="text-decoration: none;">Cancelar</a>
</header>

<div class="content-card">
  <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="form">
    
    <div class="form__row">
      <div class="field">
        <label for="first_name" class="field__label">Nombre</label>
        <input type="text" id="first_name" formControlName="first_name" class="field__input" placeholder="Ej: Juan">
      </div>
      <div class="field">
        <label for="last_name" class="field__label">Apellido</label>
        <input type="text" id="last_name" formControlName="last_name" class="field__input" placeholder="Ej: Pérez">
      </div>
    </div>

    <div class="form__row">
      <div class="field">
        <label for="email" class="field__label">Correo electrónico</label>
        <input type="email" id="email" formControlName="email" class="field__input" placeholder="juan@ejemplo.com">
      </div>
      <div class="field">
        <label for="password" class="field__label">Contraseña temporal</label>
        <input type="password" id="password" formControlName="password" class="field__input" placeholder="••••••••">
        <span class="field__hint-text">Mínimo 8 caracteres. El usuario podrá cambiarla luego.</span>
      </div>
    </div>

    <div class="field">
      <label for="role_id" class="field__label">Rol en el sistema</label>
      <select id="role_id" formControlName="role_id" class="field__input" style="appearance: auto;">
        <option value="" disabled selected>Seleccione un rol...</option>
        <option *ngFor="let role of roles" [value]="role.id">{{ role.name }}</option>
      </select>
    </div>

    <div class="field" style="flex-direction: row; align-items: center; gap: 8px;">
      <input type="checkbox" id="is_active" formControlName="is_active" style="width: 18px; height: 18px; accent-color: var(--color-primary);">
      <label for="is_active" class="field__label" style="margin-bottom: 0;">Usuario Activo</label>
    </div>

    <div *ngIf="errorMessage" class="alert alert--error" style="margin-top: 16px;">
      <svg viewBox="0 0 20 20" fill="currentColor" style="width:20px;height:20px;"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
      {{ errorMessage }}
    </div>

    <div class="form__actions">
      <button type="submit" class="btn btn--primary" [disabled]="userForm.invalid || isLoading">
        <span *ngIf="!isLoading">Guardar Usuario</span>
        <span *ngIf="isLoading" class="btn__loader"></span>
      </button>
    </div>
  </form>
</div>
